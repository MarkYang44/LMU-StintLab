name: Windows validation and portable build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Verify public source
        run: python tools/audit_publication.py
      - name: Install verified build dependencies
        run: python tools/install_dependencies.py --build
      - name: Run isolated regression tests
        run: python tools/run_tests.py
      - name: Build independent portable ZIP
        run: python build.py
      - name: Validate clean portable package
        run: python tools/check_bundle.py --smoke
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LMU-StintLab-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: LMU-StintLab-windows-x64
          path: dist
      - name: Publish verified Release for a version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match VERSION' }
          gh release create $env:GITHUB_REF_NAME "dist/LMU-StintLab-v$version-windows-x64.zip" "dist/LMU-StintLab-v$version-windows-x64.zip.sha256" --verify-tag --latest --title "LMU StintLab v$version" --notes-file docs/RELEASE_NOTES.md
